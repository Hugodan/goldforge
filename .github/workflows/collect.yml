name: Collect prices

# Blizzard refreshes each WoW Forever auction house about once an hour, each at its own minute
# (the EU houses land at about :22-:23 past the hour). Checking at :26 catches that snapshot
# ~3 minutes after it appears; the other checks are cheap If-Modified-Since retries (HTTP 304)
# in case Blizzard is late. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "26,41,56,11 * * * *"
  workflow_dispatch:
    inputs:
      force_gamedata:
        description: "Re-read recipes and items from wago.tools now"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**", "collector/**", "config.json", "seed/**", ".github/workflows/collect.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      # Always run the newest code on main. "Re-run jobs" on an old run would otherwise
      # collect with that run's old code and deploy its old site over the current one.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        if: github.event_name == 'push'
        working-directory: collector
        run: pip install -q pytest && python -m pytest -q

      - name: Restore collector state
        env:
          TOKEN: ${{ github.token }}
        run: |
          if git clone -q --depth 1 --branch state "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state 2>/dev/null; then
            echo "restored state from the state branch"
          else
            echo "no state branch yet: first run"
            mkdir -p state && git -C state init -q
            git -C state remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Collect
        id: run
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
        working-directory: collector
        run: |
          if [ -z "$BNET_CLIENT_ID" ] || [ -z "$BNET_CLIENT_SECRET" ]; then
            echo "::error::Add the BNET_CLIENT_ID and BNET_CLIENT_SECRET secrets (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi
          ARGS="--config ../config.json --state ../state --out ../public/data"
          if [ "${{ github.event_name }}" != "schedule" ]; then ARGS="$ARGS --force-publish"; fi
          if [ "${{ inputs.force_gamedata }}" = "true" ]; then ARGS="$ARGS --force-gamedata"; fi
          python -m goldforge_collector.run $ARGS

      - name: Save collector state
        if: always() && steps.run.outcome == 'success'
        working-directory: state
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "state unchanged"; exit 0; fi
          git checkout -q --orphan snapshot
          git add -A
          git -c user.name="goldforge-bot" -c user.email="goldforge-bot@users.noreply.github.com" commit -q -m "collector state $(date -u +%FT%TZ)"
          git push -q -f origin snapshot:state

      - name: Assemble site
        if: steps.run.outputs.changed == 'true'
        run: |
          cp -r site/. public/
          touch public/.nojekyll
          # Version every script and stylesheet URL with the commit id, so a browser
          # never mixes a new page with code it cached from an older deploy.
          V="$(git rev-parse --short=10 HEAD)"
          echo "$V" > public/version.txt
          sed -i "s#__BUILD__#$V#" public/js/app.js
          sed -i -E "s#from '(\./[a-z]+\.js)'#from '\1?v=$V'#g" public/js/*.js
          sed -i -E "s#(href=\"css/app\.css)\"#\1?v=$V\"#; s#(src=\"js/app\.js)\"#\1?v=$V\"#" public/index.html
          grep -q "js/app.js?v=$V" public/index.html
          if grep -h "from '\./" public/js/*.js | grep -v "?v=$V'"; then echo "unversioned import"; exit 1; fi

      - name: Upload site
        if: steps.run.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
